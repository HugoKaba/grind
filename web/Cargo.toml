[package]
name = "grind-web"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.7" }
leptos_router = { version = "0.7" }
leptos_meta = { version = "0.7" }
leptos_axum = { version = "0.7", optional = true }

# DTOs partagés client/serveur (WASM-safe)
grind-shared = { path = "../crates/shared" }
serde = { workspace = true }
# Couches serveur (server functions) — SSR uniquement
grind-domain = { path = "../crates/domain", optional = true }
grind-application = { path = "../crates/application", optional = true }
grind-infrastructure = { path = "../crates/infrastructure", optional = true }

axum = { version = "0.7", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
tower-http = { version = "0.6", features = ["fs", "compression-br", "compression-gzip"], optional = true }
jsonwebtoken = { version = "9", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
serde_json = { version = "1", optional = true }
# Profiling continu (Grafana Pyroscope) — SSR uniquement, activé si PYROSCOPE_URL défini.
pyroscope = { version = "0.5", optional = true }
pyroscope_pprofrs = { version = "0.2", optional = true }

wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["ssr"]
hydrate = ["leptos/hydrate", "dep:wasm-bindgen", "dep:console_error_panic_hook"]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:tower-http",
    "dep:leptos_axum",
    "dep:grind-domain",
    "dep:grind-application",
    "dep:grind-infrastructure",
    "dep:jsonwebtoken",
    "dep:chrono",
    "dep:serde_json",
    "dep:pyroscope",
    "dep:pyroscope_pprofrs",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[package.metadata.leptos]
output-name = "grind"
site-root = "target/site"
site-pkg-dir = "pkg"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
# TailwindCSS v4 (config CSS-first, cf. style/tailwind.css) : cargo-leptos compile
# ce fichier vers /pkg/grind.css via le binaire Tailwind standalone (pas de Node).
tailwind-input-file = "style/tailwind.css"
