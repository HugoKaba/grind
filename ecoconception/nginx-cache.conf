# Reverse-proxy nginx avec CACHE devant l'app GRIND (127.0.0.1:3000).
# Démontre un HIT/MISS RÉEL : nginx respecte le Cache-Control de l'app.
#   - route publique (public, s-maxage)   -> mise en cache -> MISS puis HIT
#   - route privée   (private, no-store)  -> jamais mise en cache -> BYPASS
#
#   nginx -c $(pwd)/ecoconception/nginx-cache.conf   (proxy sur :8080)
worker_processes 1;
error_log /tmp/grind-nginx-err.log warn;
pid /tmp/grind-nginx.pid;
events { worker_connections 256; }
http {
  proxy_cache_path /tmp/grind-nginx-cache levels=1:2 keys_zone=grind:10m max_size=50m inactive=10m;
  access_log off;

  server {
    listen 8080;

    location / {
      proxy_pass http://127.0.0.1:3000;
      proxy_set_header Host $host;

      proxy_cache grind;
      proxy_cache_methods GET HEAD;
      proxy_cache_key "$scheme$request_method$host$request_uri";
      # nginx respecte nativement Cache-Control: private / no-store / no-cache
      # et Set-Cookie -> ces réponses ne sont PAS mises en cache.

      # SÉCURITÉ : une requête portant un cookie de session ne doit JAMAIS être
      # servie depuis le cache partagé ni y être stockée -> PASS systématique.
      proxy_cache_bypass $cookie_session;
      proxy_no_cache     $cookie_session;

      add_header X-Cache-Status $upstream_cache_status always;
    }
  }
}
